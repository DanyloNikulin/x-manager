[package]
name = "x-manager-orchestrator"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Subscription-backed Claude/Codex worker for X-Manager"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.20"
tokio = { version = "1.47", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "time"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dev-dependencies]
pretty_assertions = "1.4"
